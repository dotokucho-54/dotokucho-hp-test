<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEWS｜株式会社道東空調</title><style>
:root{--b:#0877bd;--n:#061d34;--i:#17384f;--m:#657b8c;--l:#dce8f1}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;background:#f7fbfe;color:var(--i)}a{text-decoration:none;color:inherit}button,input,textarea{font:inherit}
header{height:76px;padding:0 5%;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid #e5edf3;position:sticky;top:0;z-index:20}.brand{font-weight:900;color:#0c4168}.nav{display:flex;gap:18px;font-size:13px;font-weight:800}
.hero{min-height:520px;padding:75px 7%;display:flex;align-items:center;position:relative;overflow:hidden;color:#fff;background:linear-gradient(125deg,#04182d,#073a60 55%,#0b6da5)}.hero:before{content:"";position:absolute;inset:0;opacity:.14;background-image:linear-gradient(#ffffff28 1px,transparent 1px),linear-gradient(90deg,#ffffff28 1px,transparent 1px);background-size:42px 42px}.heroimg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.25}.heroin{position:relative;z-index:2;max-width:900px}.k{font-size:12px;letter-spacing:.3em;color:#91dcff;font-weight:900}.hero h1{font-size:clamp(38px,6vw,72px);margin:10px 0 14px}.copy{line-height:1.9;color:#d9effb}.sen{margin-top:28px;font-size:clamp(26px,4vw,50px);font-weight:950;font-style:italic;letter-spacing:.14em;text-shadow:0 0 18px #52c7ff}.sjp{margin-top:8px;color:#a7e1ff;font-weight:850;letter-spacing:.12em}
.sec{max-width:1120px;margin:auto;padding:70px 5%}.head h2{margin:4px 0 20px;color:#0c355b;font-size:36px}.en{font-size:11px;color:var(--b);font-weight:900;letter-spacing:.2em}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#fff;border:1px solid var(--l);border-radius:15px;overflow:hidden;box-shadow:0 10px 28px #1231}.media{height:210px;background:linear-gradient(135deg,#d6ebf6,#7faac2);background-size:cover;background-position:center}.cb{padding:20px}.cb h3{margin:0 0 8px;color:#0c355b}.cb p{margin:0;color:var(--m);font-size:13px;line-height:1.8}.info{background:#fff;border:1px solid var(--l);border-radius:15px;padding:26px}.row{display:grid;grid-template-columns:130px 1fr;gap:15px;padding:12px 0;border-bottom:1px solid #e8eff4}.row:last-child{border-bottom:0}.foot{background:#041a2d;color:#abc4d3;text-align:center;padding:30px}
.pagehero{padding:65px 7%;color:#fff;background:linear-gradient(125deg,#04182d,#073a60 55%,#0b6da5)}.pagehero h1{font-size:48px;margin:8px 0}.panel{background:#fff;border:1px solid var(--l);border-radius:15px;padding:25px}.news-image{display:block;width:min(100%,900px);max-height:620px;object-fit:contain;margin:18px 0 4px;border-radius:12px;background:#f2f7fa;border:1px solid #e1ebf2}.back{display:inline-block;margin-top:25px;padding:10px 16px;border:1px solid #b5d4e6;border-radius:8px;color:#0a659c}
.news-row{display:grid;grid-template-columns:130px 1fr 28px;gap:18px;align-items:center;padding:19px 4px;border-bottom:1px solid #e8eff4}.news-row:last-child{border-bottom:0}.news-date{color:#0877bd;font-weight:850;font-size:14px}.news-date:hover,.news-title:hover{text-decoration:underline}.news-list-main{min-width:0}.news-category{font-size:11px;color:#708493;margin-bottom:5px}.news-title{display:inline-block;color:#0c355b;font-size:17px;font-weight:850;line-height:1.5}.news-arrow{color:#8bb9d3;font-size:28px;text-align:right}.news-detail .news-meta{font-size:13px;color:#6b8191;margin-bottom:9px}.news-detail h2{font-size:clamp(25px,4vw,38px);line-height:1.4;color:#0c355b;margin:0 0 24px}.news-body{overflow-wrap:anywhere;white-space:normal;line-height:2;color:#536d7e;font-size:15px}.news-detail .back{margin-top:30px}
@media(max-width:760px){header{height:auto;padding:12px 5%;align-items:flex-start}.nav{gap:9px;flex-wrap:wrap;justify-content:flex-end;font-size:11px}.grid3{grid-template-columns:1fr}.hero{min-height:500px}.row{grid-template-columns:100px 1fr}.news-row{grid-template-columns:88px 1fr 20px;gap:10px;padding:16px 0}.news-date{font-size:12px}.news-title{font-size:15px}.news-arrow{font-size:23px}}
</style></head><body>
<header><a class="brand" href="index.html">株式会社 道東空調</a><nav class="nav"><a href="index.html">ホーム</a><a href="works.html">実績紹介</a><a href="recruit.html">採用情報</a><a href="news.html">お知らせ</a><a href="https://sankyo-setsubi.jp/contact/">お問い合わせ</a></nav></header>
<section class="pagehero"><div class="en">DOTOKUCHO / INFORMATION</div><h1>NEWS</h1></section><main class="sec"><section class="panel"><div id="newsList"></div></section><a class="back" id="pageBack" href="index.html">← TOPページへ戻る</a></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl=s=>esc(s).replace(/\n/g,'<br>');
(async()=>{
  const r=await fetch('/api/cms?type=news',{cache:'no-store'}),a=await r.json();
  a.sort((x,y)=>String(y.date).localeCompare(String(x.date)));
  const now=Date.now();
  const visible=n=>{if(n.status==='draft')return false;if(n.status==='scheduled'){if(!n.publishAt)return false;const t=Date.parse(n.publishAt+':00+09:00');return Number.isFinite(t)&&t<=now}return true};
  const published=a.filter(visible);
  const renderBody=n=>{let body=esc(n.body||'');body=body.replace(/\[\[(大|小)\]\]([\s\S]*?)\[\[\/\1\]\]/g,(_,size,content)=>`<span style="font-size:${size==='大'?'1.4em':'0.85em'}">${content}</span>`);body=body.replace(/\[\[画像(\d+)\]\]/g,(_,num)=>{const im=(n.images||[])[Number(num)-1];return im?`<img class="news-image" src="/api/cms?asset=${encodeURIComponent(im.key)}" alt="記事画像" loading="lazy">`:''});return body.replace(/\n/g,'<br>')};
  const richBody=n=>{
    if(!n.bodyHtml)return renderBody(n);
    const doc=new DOMParser().parseFromString('<div>'+n.bodyHtml+'</div>','text/html');
    const root=doc.body.firstElementChild;
    const allow=new Set(['DIV','P','BR','B','STRONG','I','EM','U','SPAN','FONT','IMG','UL','OL','LI']);
    const clean=node=>{
      if(node.nodeType===3)return document.createTextNode(node.textContent);
      if(node.nodeType!==1)return document.createTextNode('');
      if(!allow.has(node.tagName)){const frag=document.createDocumentFragment();[...node.childNodes].forEach(ch=>frag.append(clean(ch)));return frag}
      const out=document.createElement(node.tagName==='FONT'?'span':node.tagName.toLowerCase());
      if(node.tagName==='IMG'){
        const key=node.getAttribute('data-asset-key')||'';
        if(!key.startsWith("news/")||!/^[-a-zA-Z0-9_/]+$/.test(key))return document.createTextNode('');
        out.src='/api/cms?asset='+encodeURIComponent(key);out.alt=node.getAttribute('alt')||'記事画像';out.loading='lazy';out.className='news-image';
        const w=node.style.width;if(['35%','65%','100%'].includes(w))out.style.width=w;
      }else{
        const fontSize=node.tagName==='FONT'?node.getAttribute('size'):null;
        if(fontSize&&/^\d$/.test(fontSize))out.style.fontSize=({'2':'0.85em','3':'1em','5':'1.4em','6':'1.8em'})[fontSize]||'1em';
        const sz=node.style.fontSize;if(['0.85em','1em','1.4em','1.8em'].includes(sz))out.style.fontSize=sz;
        [...node.childNodes].forEach(ch=>out.append(clean(ch)));
      }
      return out;
    };
    const container=document.createElement('div');[...root.childNodes].forEach(ch=>container.append(clean(ch)));
    return container.innerHTML;
  };
  const id=new URLSearchParams(location.search).get('id');
  if(id){
    const n=published.find(x=>String(x.id)===id);
    if(!n){
      newsList.innerHTML='<p>お知らせが見つかりませんでした。</p>';
    }else{
      document.title=(n.title||'お知らせ')+'｜株式会社道東空調';
      newsList.innerHTML=`<article class="news-detail"><div class="news-meta">${esc(n.date||'')} ｜ ${esc(n.category||'')}</div><h2>${esc(n.title||'')}</h2><div class="news-body">${richBody(n)}</div>${n.imageKey?`<img class="news-image" src="/api/cms?asset=${encodeURIComponent(n.imageKey)}" alt="${esc((n.title||'お知らせ')+'の画像')}" loading="lazy">`:''}<a class="back" href="news.html">← お知らせ一覧へ戻る</a></article>`;
      pageBack.style.display='none';
    }
  }else{
    newsList.innerHTML=published.length?published.map(n=>`<div class="news-row"><a class="news-date" href="news.html?id=${encodeURIComponent(n.id)}">${esc(n.date||'')}</a><div class="news-list-main"><div class="news-category">${esc(n.category||'')}</div><a class="news-title" href="news.html?id=${encodeURIComponent(n.id)}">${esc(n.title||'')}</a></div><span class="news-arrow">›</span></div>`).join(''):'現在、お知らせはありません。';
  }
})();
</script></body></html>
